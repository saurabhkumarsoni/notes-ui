<nav class="bg-blue-600 p-4 flex justify-between items-center text-white relative">
  <div class="text-xl font-bold">Notes App</div>

  <div *ngIf="userName" class="relative flex items-center gap-3">
    <!-- Profile Image -->
    <img [src]="profileImage || defaultAvatar" alt="Profile"
      class="w-8 h-8 rounded-full object-cover border-2 border-white" />

    <!-- Dropdown Trigger -->
    <button (click)="toggleMenu()" class="font-medium hover:text-gray-200 flex items-center gap-2 focus:outline-none">
      <span>Welcome, {{ userName }}</span>
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </button>

    <!-- Dropdown -->
    <div *ngIf="menuOpen" class="absolute right-0 mt-2 w-48 bg-white text-gray-800 rounded-lg shadow-lg z-50">
      <a (click)="goToProfile()" class="flex items-center px-4 py-3 hover:bg-gray-100 cursor-pointer gap-3">
        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M5.121 17.804A7 7 0 0112 15a7 7 0 016.879 2.804M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span>Profile</span>
      </a>

      <hr class="border-gray-200" />

      <a (click)="logout()" class="flex items-center px-4 py-3 hover:bg-gray-100 cursor-pointer gap-3">
        <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1" />
        </svg>
        <span class="text-red-600">Logout</span>
      </a>
    </div>
  </div>
</nav>
