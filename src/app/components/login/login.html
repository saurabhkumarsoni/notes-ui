<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md p-8 bg-white rounded-xl shadow-lg">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <input type="email" placeholder="Email" formControlName="email"
        class="w-full px-4 mb-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />

      <input type="password" placeholder="Password" formControlName="password"
        class="w-full px-4 mb-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />

      <button type="submit"
        class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 disabled:opacity-50">
        Login
      </button>
    </form>


    <p class="mt-4 text-center text-red-500 text-sm">{{ message }}</p>

    <!-- Register link -->
    <p class="mt-6 text-center text-sm text-gray-600">
      Not a member?
      <a routerLink="/register" class="text-blue-600 cursor-pointer hover:underline font-medium">
        Register here
      </a>
    </p>

  </div>
</div>
