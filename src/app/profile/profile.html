<form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="container mt-4 p-4 bg-light rounded shadow-sm">
  <h2 class="mb-4">User Profile</h2>

  <!-- Profile Image -->

  <div class="flex justify-center mb-4">
    <div class="relative w-32 h-32 rounded-full overflow-hidden">
      <img [src]="profileImage()" alt="profile-image" class="w-full h-full object-cover" />
      <button type="button" class="absolute bottom-1 right-1 bg-white p-1 rounded-full shadow"
        (click)="fileInput.click()">
        ✏️
      </button>
      <input #fileInput type="file" accept="image/*" (change)="onFileChange($event)" hidden />
    </div>
  </div>



  <!-- Basic Info -->
  <div class="row">
    <div class="col-md-6 mb-3">
      <mat-form-field appearance="fill" class="w-100">
        <mat-label>First Name</mat-label>
        <input matInput formControlName="firstName">
      </mat-form-field>
    </div>
    <div class="col-md-6 mb-3">
      <mat-form-field appearance="fill" class="w-100">
        <mat-label>Last Name</mat-label>
        <input matInput formControlName="lastName">
      </mat-form-field>
    </div>
  </div>

  <div class="row">
    <div class="col-md-6 mb-3">
      <mat-form-field appearance="fill" class="w-100">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email">
      </mat-form-field>
    </div>
    <div class="col-md-6 mb-3">
      <mat-form-field appearance="fill" class="w-100">
        <mat-label>Phone</mat-label>
        <input matInput type="text" formControlName="phone">
      </mat-form-field>
    </div>
  </div>

  <div class="row">
    <div class="col-md-6 mb-3">
      <app-custom-datepicker [label]="'Date of Birth'" [value]="profileForm.get('dateOfBirth')?.value"
        (valueChange)="profileForm.get('dateOfBirth')?.setValue($event)">
      </app-custom-datepicker>
    </div>


    <div class="col-md-6 mb-3">
      <mat-form-field appearance="fill" class="w-100">
        <mat-label>Gender</mat-label>
        <mat-select formControlName="gender">
          <mat-option value="Male">Male</mat-option>
          <mat-option value="Female">Female</mat-option>
          <mat-option value="Other">Other</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <!-- Job Details -->
  <div class="row">
    <div class="col-md-6 mb-3">
      <app-custom-dropdown [label]="'Position'" [options]="positions" [value]="profileForm.get('position')?.value"
        (valueChange)="profileForm.get('position')?.setValue($event)">
      </app-custom-dropdown>
    </div>

    <div class="col-md-6 mb-3">
      <app-custom-dropdown [label]="'Department'" [options]="departments" [value]="profileForm.get('department')?.value"
        (valueChange)="profileForm.get('department')?.setValue($event)">
      </app-custom-dropdown>
    </div>

  </div>

  <div class="row">
    <div class="col-md-6 mb-3">
      <mat-form-field appearance="fill" class="w-100">
        <mat-label>Employee ID</mat-label>
        <input matInput formControlName="employeeId">
      </mat-form-field>
    </div>
    <div class="col-md-6 mb-3">
      <app-custom-datepicker [label]="'Date of Joining'" [value]="profileForm.get('dateOfJoining')?.value"
        (valueChange)="profileForm.get('dateOfJoining')?.setValue($event)">
      </app-custom-datepicker>
    </div>

  </div>

  <app-custom-autocomplete [label]="'Reporting Manager'" [managers]="managers"
    [selected]="profileForm.get('reportingManager')?.value"
    (selectedChange)="profileForm.get('reportingManager')?.setValue($event)">
  </app-custom-autocomplete>


  <!-- Skills -->
  <div class="mb-3">
    <label class="form-label">Skills</label>
    <div formArrayName="skills">
      <div *ngFor="let skill of skills.controls; let i = index" class="d-flex align-items-center mb-2">
        <input matInput [formControlName]="i" class="form-control me-2">
        <button mat-icon-button color="warn" (click)="removeSkill(i)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
      <button mat-stroked-button color="primary" type="button" (click)="addSkill()">Add Skill</button>
    </div>
  </div>


  <!-- Others -->
  <div class="row">
    <div class="col-md-6 mb-3">
      <mat-form-field appearance="fill" class="w-100">
        <mat-label>Experience</mat-label>
        <input matInput formControlName="experience">
      </mat-form-field>
    </div>
    <div class="col-md-6 mb-3">
      <mat-checkbox formControlName="isMarried">Married</mat-checkbox>
    </div>
  </div>

  <mat-form-field appearance="fill" class="w-100 mb-3">
    <mat-label>LinkedIn</mat-label>
    <input matInput formControlName="linkedin">
  </mat-form-field>

  <mat-form-field appearance="fill" class="w-100 mb-3">
    <mat-label>GitHub</mat-label>
    <input matInput formControlName="github">
  </mat-form-field>


  <!-- Address Section -->
  <div formGroupName="address" class="row">
    <label class="form-label">Address</label>
    <div class="col-md-4 mb-3">
      <mat-form-field class="w-100">
        <mat-label>Street</mat-label>
        <input matInput formControlName="street" />
      </mat-form-field>
    </div>
    <div class="col-md-4 mb-3">
      <mat-form-field class="w-100">
        <mat-label>City</mat-label>
        <input matInput formControlName="city" />
      </mat-form-field>
    </div>
    <div class="col-md-4 mb-3">
      <mat-form-field class="w-100">
        <mat-label>State</mat-label>
        <input matInput formControlName="state" />
      </mat-form-field>
    </div>
    <div class="col-md-4 mb-3">
      <mat-form-field class="w-100">
        <mat-label>Zip</mat-label>
        <input matInput formControlName="zip" />
      </mat-form-field>
    </div>
    <div class="col-md-4 mb-3">
      <mat-form-field class="w-100">
        <mat-label>Country</mat-label>
        <input matInput formControlName="country" />
      </mat-form-field>
    </div>
  </div>


  <div class="text-center">
    <button mat-raised-button color="primary" type="submit">Save Profile</button>
  </div>
</form>
