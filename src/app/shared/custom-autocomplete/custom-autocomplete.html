<mat-form-field appearance="fill" class="w-100 mb-3">
  <mat-label>{{ label }}</mat-label>
  <input matInput [matAutocomplete]="auto" [formControl]="control" [placeholder]="placeholder" />
  <mat-autocomplete #auto="matAutocomplete">
    <mat-option *ngFor="let manager of filteredManagers | async" [value]="manager.name">
      <div class="flex items-center gap-3">
        <ng-container *ngIf="showImage">
          <img [src]="manager.image" alt="Avatar" width="32" height="32" class="rounded-full" />
        </ng-container>
        <div class="text-sm">
          <div class="font-medium">{{ manager.name }}</div>
          <div class="text-xs text-gray-500" *ngIf="manager.position || manager.project">
            {{ manager.position }}<span *ngIf="manager.position && manager.project"> • </span>{{ manager.project }}
          </div>
        </div>
      </div>
    </mat-option>
  </mat-autocomplete>

</mat-form-field>
